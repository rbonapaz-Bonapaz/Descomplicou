name: Patch infraestrutura v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-infra-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar patch
        run: python .github/scripts/patch_infra_v2.py

      - name: Commitar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infraestrutura/index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "feat(infraestrutura): conexões, PDF e backup de configuração"
          git push
