name: Validar infraestrutura

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-infra-v2.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar HTML e JavaScript
        run: python .github/scripts/validate_infra.py
