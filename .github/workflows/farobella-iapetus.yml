name: Gerar locução FaroBella com Iapetus

on:
  push:
    branches:
      - ai/farobella-iapetus
    paths:
      - tools/farobella_iapetus_cloud.py
      - .github/workflows/farobella-iapetus.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/farobella_iapetus_cloud.py
      - .github/workflows/farobella-iapetus.yml

permissions:
  contents: read

jobs:
  gerar-locucoes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_CLOUD_PROJECT: crm-consultora-de-beleza

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar credencial do FaroBella
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT" || {
            echo "Secret FIREBASE_SERVICE_ACCOUNT ausente"
            exit 1
          }

      - name: Autenticar no Google Cloud
        id: google-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Preparar Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT }}

      - name: Garantir permissão mínima para Gemini TTS
        shell: bash
        run: |
          set -euo pipefail
          SA_EMAIL="$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          key_path = Path(os.environ["GOOGLE_APPLICATION_CREDENTIALS"])
          data = json.loads(key_path.read_text(encoding="utf-8"))
          print(data["client_email"])
          PY
          )"
          test -n "$SA_EMAIL" || {
            echo "Não foi possível identificar a conta de serviço."
            exit 1
          }
          echo "::add-mask::$SA_EMAIL"

          if ! gcloud projects add-iam-policy-binding "$GOOGLE_CLOUD_PROJECT" \
            --member="serviceAccount:$SA_EMAIL" \
            --role="roles/aiplatform.user" \
            --quiet >/tmp/iam-binding.log 2>&1; then
            cat /tmp/iam-binding.log
            echo "A conta de serviço não tem permissão para alterar o IAM do projeto."
            echo "Conceda a ela o papel roles/aiplatform.user no projeto $GOOGLE_CLOUD_PROJECT."
            exit 1
          fi

      - name: Preparar Python e FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet --upgrade "google-cloud-texttospeech>=2.29.0"

      - name: Gerar locuções oficiais Iapetus pela Cloud TTS
        run: python3 tools/farobella_iapetus_cloud.py

      - name: Publicar áudios gerados
        uses: actions/upload-artifact@v4
        with:
          name: farobella-iapetus-audio
          path: |
            farobella_tts_output/farobella_completo_iapetus_cloud.wav
            farobella_tts_output/farobella_teaser_iapetus_cloud.wav
            farobella_tts_output/roteiro_falado_iapetus_cloud.txt
            farobella_tts_output/*_cloud_report.json
          retention-days: 1
          if-no-files-found: error
