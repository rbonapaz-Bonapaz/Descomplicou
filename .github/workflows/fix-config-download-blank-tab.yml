name: Corrigir download de configuracao

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-config-download-blank-tab.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar patch
        run: python .github/scripts/fix_config_download_blank_tab.py

      - name: Validar JavaScript principal
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text = Path('infraestrutura/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, re.S)
          if not scripts:
              raise SystemExit('Nenhum script inline encontrado')
          js = scripts[-1]
          with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8') as f:
              f.write(js)
              name = f.name
          subprocess.run(['node', '--check', name], check=True)
          print('JavaScript OK')
          PY

      - name: Commitar alteracoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infraestrutura/index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao necessaria."
            exit 0
          fi
          git commit -m "fix(infraestrutura): baixa configuracao sem abrir aba em branco"
          git push
