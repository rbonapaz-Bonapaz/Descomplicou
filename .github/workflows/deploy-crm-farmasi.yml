name: Deploy CRM Farmasi (Firebase Hosting) [DESATIVADO]

# DESATIVADO em 2026-07-28: o deploy do FaroBella (farobella.web.app) migrou pro monorepo Nexa
# (github.com/rbonapaz-Bonapaz/Nexa, apps/farobella/), que tem seu próprio workflow
# (.github/workflows/deploy-farobella.yml) já testado e publicando com sucesso. Manter o gatilho
# automático aqui faria os dois repositórios disputarem o mesmo site — dois "firebase deploy"
# concorrentes pro mesmo Hosting target. O trigger por push foi removido; só sobrou
# workflow_dispatch (manual) como rede de segurança, caso precise publicar daqui de novo por
# algum motivo excepcional.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CRM-Farmasi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy no Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-key.json
          firebase deploy --only hosting:farobella --project crm-consultora-de-beleza --non-interactive
